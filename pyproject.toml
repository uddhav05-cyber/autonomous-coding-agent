[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-agent"
version = "0.1.0"
description = "Foundation for Autonomous Coding Agent - Phase 1"
authors = [
    {name = "uddhav bhople", email = "uddhav@example.com"}
]
dependencies = [
    "pydantic>=2.0",
    "loguru>=0.7.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
[project.scripts]
autonomous-agent = "autonomous_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
